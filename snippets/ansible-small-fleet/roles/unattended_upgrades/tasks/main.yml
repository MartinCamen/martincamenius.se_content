---
- name: Install unattended-upgrades and needrestart
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - needrestart
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    # Don't let needrestart restart anything while we install it.
    NEEDRESTART_SUSPEND: "1"

- name: Install security updates only, and never the held packages
  ansible.builtin.template:
    src: 90-security-only.j2
    dest: /etc/apt/apt.conf.d/90-security-only
    owner: root
    group: root
    mode: "0644"

- name: Tell needrestart to list services instead of restarting them
  ansible.builtin.template:
    src: 90-no-restarts.conf.j2
    dest: /etc/needrestart/conf.d/90-no-restarts.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the timer override directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run the nightly upgrade at a time you choose
  ansible.builtin.template:
    src: timer-override.conf.j2
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the upgrade timer
