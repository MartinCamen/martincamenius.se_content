[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Ask for the vault password on every real run, so nobody has to remember --ask-vault-pass.
vault_identity_list = default@prompt
# Run handlers even when a later task fails, so a changed config is never left unloaded.
force_handlers = True
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
