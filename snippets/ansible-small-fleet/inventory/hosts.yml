---
# One file, one list of servers. The groups do the real work:
#   self_maintained: servers you patch yourself. Every playbook targets this group, never `all`.
#   provider_managed: servers your host patches. Listed so you know they exist, never touched.
#   standard / critical: patch order. Standard servers go first, as canaries.
all:
  children:
    self_maintained:
      children:
        standard:
          hosts:
            web-1:
              ansible_host: 203.0.113.10
            staging-1:
              ansible_host: 203.0.113.11
        critical:
          hosts:
            api-1:
              ansible_host: 203.0.113.20
              # Ubuntu 26.04's default sudo (sudo-rs) makes Ansible time out on the password prompt.
              ansible_become_exe: sudo.ws
    provider_managed:
      hosts:
        shared-hosting-1:
          ansible_host: 203.0.113.30
  vars:
    ansible_user: deploy
    # Which services run where decides what is held back and what is restarted.
    services: [nginx, php-fpm, mysql, redis, supervisor]
